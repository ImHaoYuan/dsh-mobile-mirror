<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<title>DSH 手机镜像 · 登录</title>
<link rel="stylesheet" href="/font.css">
<style>
  :root {
    color-scheme: light dark;
    --bg:#0f1115; --card:#181b22; --line:#262b35; --fg:#e8eaed; --dim:#9aa3b2;
    --accent:#4c8dff; --bad:#ff6b6b; --warn:#ffb454;
    --code:#0b0d11; --on-accent:#fff; --bad-bg:#2a1618; --line-bad:#5c2b2f; --danger-fg:#ffb3b3;
  }
  /* 浅色主题：和 app.css 那套对齐（近白底 + DeepSeek 的蓝 #4d6bfe） */
  @media (prefers-color-scheme: light) {
    :root {
      --bg:#f6f7f9; --card:#ffffff; --line:#e2e5ea; --fg:#1b1f24; --dim:#575f6b;
      --accent:#4d6bfe; --bad:#c62828; --warn:#9a6700;
      --code:#f2f4f7; --on-accent:#ffffff; --bad-bg:#fdecea; --line-bad:#f2c2c2; --danger-fg:#b3261e;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; padding:24px 16px; background:var(--bg); color:var(--fg);
    font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; justify-content:center; -webkit-text-size-adjust:100%;
  }
  .wrap { width:100%; max-width:380px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 6px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:22px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px; }
  label { display:block; font-size:13px; color:var(--dim); margin:0 0 6px; }
  input[type=text], input[type=password] {
    width:100%; padding:13px 14px; margin-bottom:16px; font-size:16px; color:var(--fg);
    background:var(--code); border:1px solid var(--line); border-radius:11px; outline:none;
  }
  input[type=text]:focus, input[type=password]:focus { border-color:var(--accent); }
  button {
    width:100%; padding:14px; border:0; border-radius:11px; background:var(--accent); color:var(--on-accent);
    font-size:16px; font-weight:600; cursor:pointer;
  }
  button:active { transform:scale(.99); }
  .err { background:var(--bad-bg); border:1px solid var(--line-bad); color:var(--danger-fg); border-radius:10px; padding:11px 13px; font-size:14px; margin-bottom:16px; }
  .note { color:var(--dim); font-size:12.5px; margin-top:16px; line-height:1.75; }
  .warn { color:var(--warn); }
  code { background:var(--code); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-size:12.5px;
         font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
</style>
</head>
<body>
<div class="wrap">
  <h1>DSH 手机镜像</h1>
  <div class="sub">用账号密码登录，查看电脑上的对话</div>

  <div class="card">
    {{ERROR}}
    <form method="post" action="/login" autocomplete="on">
      <label for="username">账号</label>
      <input id="username" name="username" type="text" value="{{USERNAME}}" autocomplete="username"
             autocapitalize="none" autocorrect="off" spellcheck="false" required>

      <label for="password">密码</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">登录</button>
    </form>
  </div>

  <div class="note" id="note"></div>
</div>

<script>
(function () {
  var secure = '{{SECURE}}' === 'yes';
  var note = document.getElementById('note');
  note.innerHTML = secure
    ? '本次连接已加密（自签证书）。若浏览器提示"连接不安全"，那是自签证书的正常表现，'
      + '在电脑上打开 <code>/setup</code> 可以下载证书装到手机上消除警告。'
    : '<span class="warn">⚠️ 当前是明文 HTTP，密码在局域网内可被抓包。</span>'
      + ' 请在电脑上打开 <code>/setup</code> 检查证书状态。';
})();
</script>
</body>
</html>

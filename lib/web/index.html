<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<title>DSH 手机镜像</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262b35; --fg:#e8eaed; --dim:#9aa3b2; --ok:#3ddc84; --bad:#ff6b6b; }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:18px 16px 40px; background:var(--bg); color:var(--fg);
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-text-size-adjust:100%;
  }
  header { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:16px; }
  h1 { font-size:19px; margin:0; letter-spacing:.2px; }
  .who { color:var(--dim); font-size:13px; }
  .who a { color:#7cb7ff; text-decoration:none; margin-left:8px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:18px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px dashed var(--line); font-size:14px; }
  .row:last-child { border-bottom:0; }
  .row .k { color:var(--dim); flex:0 0 auto; }
  .row .v { text-align:right; word-break:break-all; font-variant-numeric:tabular-nums; }
  .badge { display:inline-flex; align-items:center; gap:7px; font-weight:600; font-size:15px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--dim); }
  .dot.ok { background:var(--ok); box-shadow:0 0 10px var(--ok); }
  .dot.bad { background:var(--bad); box-shadow:0 0 10px var(--bad); }
  code { background:#0b0d11; border:1px solid var(--line); border-radius:6px; padding:1px 6px; font-size:13px; }
  button { width:100%; margin-top:10px; padding:12px; border-radius:11px; border:1px solid var(--line);
    background:#20242c; color:var(--fg); font-size:15px; font-weight:600; }
  button:active { transform:scale(.99); }
  .note { color:var(--dim); font-size:12.5px; line-height:1.75; }
  a { color:#7cb7ff; }
</style>
</head>
<body>
  <header>
    <h1>DSH 手机镜像</h1>
    <div class="who">{{USERNAME}}<a href="/logout">退出</a></div>
  </header>
  <div class="sub">已登录 · 会话镜像在 P1 接入</div>

  <div class="card">
    <div class="badge"><span class="dot" id="dot"></span><span id="verdict">正在探测…</span></div>
    <button id="retry">重新探测</button>
  </div>

  <div class="card">
    <div class="row"><span class="k">服务端</span><span class="v" id="origin">—</span></div>
    <div class="row"><span class="k">/health</span><span class="v" id="health">—</span></div>
    <div class="row"><span class="k">往返耗时</span><span class="v" id="rtt">—</span></div>
    <div class="row"><span class="k">传输加密</span><span class="v" id="secure">—</span></div>
    <div class="row"><span class="k">屏幕</span><span class="v" id="screen">—</span></div>
    <div class="row"><span class="k">手机时间</span><span class="v" id="now">—</span></div>
  </div>

  <div class="card note">
    P0 阶段到此为止：<b>端口监听、局域网可达、HTTPS、账号密码登录</b>都已打通。<br>
    下一步（P1）会做：会话列表、历史快照、实时逐字输出，以及手机发消息和停止当前轮。
  </div>

<script>
(function () {
  var dot = document.getElementById('dot');
  var verdict = document.getElementById('verdict');
  var healthEl = document.getElementById('health');
  var rttEl = document.getElementById('rtt');
  var originEl = document.getElementById('origin');
  var secureEl = document.getElementById('secure');
  var screenEl = document.getElementById('screen');
  var nowEl = document.getElementById('now');
  var retry = document.getElementById('retry');

  originEl.textContent = location.origin;
  secureEl.textContent = location.protocol === 'https:' ? 'HTTPS（自签证书）' : 'HTTP —— 明文';
  screenEl.textContent = window.innerWidth + '×' + window.innerHeight + ' @' + (window.devicePixelRatio || 1) + 'x';
  nowEl.textContent = new Date().toLocaleString('zh-CN');

  function probe() {
    dot.className = 'dot';
    verdict.textContent = '正在探测…';
    healthEl.textContent = '—';
    rttEl.textContent = '—';
    var t0 = performance.now();
    fetch('/health?ts=' + Date.now(), { cache: 'no-store', credentials: 'same-origin' })
      .then(function (res) {
        var ms = Math.round(performance.now() - t0);
        return res.text().then(function (body) { return { res: res, body: body, ms: ms }; });
      })
      .then(function (r) {
        healthEl.textContent = r.res.status + ' ' + r.body.trim();
        rttEl.textContent = r.ms + ' ms';
        if (r.res.ok) {
          dot.className = 'dot ok';
          verdict.textContent = '已连通';
        } else {
          dot.className = 'dot bad';
          verdict.textContent = '服务端返回 ' + r.res.status;
        }
      })
      .catch(function (err) {
        healthEl.textContent = '失败';
        dot.className = 'dot bad';
        verdict.textContent = '连不上：' + (err && err.message ? err.message : err);
      });
  }

  retry.addEventListener('click', probe);
  probe();
})();
</script>
</body>
</html>

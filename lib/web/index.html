<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSH 镜像">
<meta name="format-detection" content="telephone=no">
<title>DSH 手机镜像</title>
<link rel="stylesheet" href="/app.css">
<script defer src="/app.js"></script>
</head>
<body data-enable-prompt="{{ENABLE_PROMPT}}">

<!-- ============================ 会话列表 ============================ -->
<section class="view" id="view-list">
  <header class="topbar">
    <div class="topbar-main">
      <div class="topbar-title">DSH 手机镜像</div>
      <div class="topbar-sub">{{USERNAME}}</div>
    </div>
    <button type="button" class="icon-btn" id="btn-refresh" aria-label="刷新会话列表" title="刷新">⟳</button>
    <a class="topbar-link" href="/logout">退出</a>
  </header>

  <div class="scroll" id="list-scroll">
    <div class="hint" id="list-hint" hidden></div>
    <div class="error-box" id="list-error" hidden>
      <div class="error-text" id="list-error-text"></div>
      <button type="button" class="btn" id="btn-list-retry">重试</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="list-empty" hidden>
      <div class="empty-title">还没有会话</div>
      <div class="empty-note">在电脑上开一段对话，这里就会出现它的镜像。</div>
    </div>
    <div class="foot-note">下拉不会刷新，点右上角 ⟳ 即可。</div>
  </div>
</section>

<!-- ============================ 对话 ============================ -->
<section class="view" id="view-chat" hidden>
  <header class="topbar">
    <button type="button" class="icon-btn" id="btn-back" aria-label="返回会话列表" title="返回">‹</button>
    <div class="topbar-main">
      <div class="topbar-title-row">
        <span class="dot" id="chat-dot"></span>
        <span class="topbar-title" id="chat-title">会话</span>
      </div>
      <div class="topbar-sub" id="chat-sub"></div>
    </div>
    <button type="button" class="btn-stop" id="btn-stop" title="停止当前这一轮" hidden>停止</button>
    <button type="button" class="ghost-btn" id="btn-raw" aria-pressed="false" title="显示最近收到的原始 JSON 信封">原始</button>
    <a class="topbar-link" href="/logout">退出</a>
  </header>

  <div class="banner" id="conn-banner" hidden>
    <span id="conn-text"></span>
    <button type="button" class="ghost-btn" id="btn-reconnect">重连</button>
  </div>

  <div class="stream-wrap">
    <div class="scroll stream" id="stream"></div>
    <div class="top-hint" id="stream-hint" hidden></div>
    <button type="button" class="to-bottom" id="btn-bottom" hidden>↓ 回到最新</button>
  </div>

  <div class="debug" id="debug" hidden>
    <div class="debug-head">
      <span>原始信封 · <span id="debug-count">0</span>/50</span>
      <span class="debug-actions">
        <button type="button" class="ghost-btn" id="btn-debug-clear">清空</button>
        <button type="button" class="ghost-btn" id="btn-debug-close">收起</button>
      </span>
    </div>
    <div class="debug-body" id="debug-body"></div>
  </div>

  <div class="composer" id="composer" hidden>
    <div class="composer-row">
      <textarea id="composer-input" rows="1" placeholder="发消息…" autocomplete="off" spellcheck="false"></textarea>
      <button type="button" class="btn btn-send" id="composer-send" disabled>发送</button>
    </div>
    <div class="composer-foot">
      <span class="composer-note">Enter 换行 · 桌面端 Ctrl/⌘ + Enter 发送</span>
      <span class="composer-count" id="composer-count" hidden></span>
    </div>
  </div>
</section>

<div class="toast" id="toast" hidden></div>

<noscript><div class="toast">这个页面需要开启 JavaScript。</div></noscript>
</body>
</html>

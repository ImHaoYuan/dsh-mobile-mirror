<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- Android Chrome 的地址栏跟着系统主题走，不然浅色页面配一条深色栏很割裂 -->
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DSH 镜像">
<meta name="format-detection" content="telephone=no">
<title>DSH 手机镜像</title>
<link rel="stylesheet" href="/font.css">
<link rel="stylesheet" href="/app.css">
<script defer src="/app.js"></script>
</head>
<body data-enable-prompt="{{ENABLE_PROMPT}}">

<!-- ============================ 会话列表 ============================ -->
<section class="view" id="view-list">
  <header class="topbar">
    <div class="topbar-main">
      <div class="topbar-title">DSH 手机镜像</div>
      <div class="topbar-sub">{{USERNAME}}</div>
    </div>
    <button type="button" class="icon-btn" id="btn-new" aria-label="新建会话" title="新建会话">＋</button>
    <button type="button" class="icon-btn" id="btn-refresh" aria-label="刷新会话列表" title="刷新">⟳</button>
    <a class="topbar-link" href="/logout">退出</a>
  </header>

  <div class="scroll" id="list-scroll">
    <div class="hint" id="list-hint" hidden></div>
    <div class="error-box" id="list-error" hidden>
      <div class="error-text" id="list-error-text"></div>
      <button type="button" class="btn" id="btn-list-retry">重试</button>
    </div>
    <div class="list" id="list"></div>
    <div class="empty" id="list-empty" hidden>
      <div class="empty-title">还没有会话</div>
      <div class="empty-note">在电脑上开一段对话，这里就会出现它的镜像。</div>
    </div>
    <div class="foot-note">下拉不会刷新，点右上角 ⟳ 即可。</div>
  </div>
</section>

<!-- ============================ 对话 ============================ -->
<section class="view" id="view-chat" hidden>
  <header class="topbar">
    <button type="button" class="icon-btn" id="btn-back" aria-label="返回会话列表" title="返回">‹</button>
    <div class="topbar-main">
      <div class="topbar-title-row">
        <span class="dot" id="chat-dot"></span>
        <span class="topbar-title" id="chat-title">会话</span>
      </div>
    </div>
    <button type="button" class="btn-stop" id="btn-stop" title="停止当前这一轮" hidden>停止</button>
    <button type="button" class="ghost-btn" id="btn-raw" aria-pressed="false" title="显示最近收到的原始 JSON 信封">原始</button>
    <a class="topbar-link" href="/logout">退出</a>
  </header>

  <div class="banner" id="conn-banner" hidden>
    <span id="conn-text"></span>
    <button type="button" class="ghost-btn" id="btn-reconnect">重连</button>
  </div>

  <div class="stream-wrap">
    <div class="scroll stream" id="stream"></div>
    <!-- 右侧快捷跳转：只标"我自己说过的话"，刻度按它们在消息流里的位置排。
         借 DeepSeek 网页端右侧那条导航的心智，但只服务"回头找我说的那句"这一件事。 -->
    <div class="rail-tip" id="rail-tip" hidden></div>
    <div class="rail" id="rail" hidden></div>
    <div class="top-hint" id="stream-hint" hidden></div>
    <button type="button" class="to-bottom" id="btn-bottom" hidden>↓ 回到最新</button>
  </div>

  <div class="debug" id="debug" hidden>
    <div class="debug-head">
      <span>原始信封 · <span id="debug-count">0</span>/50</span>
      <span class="debug-actions">
        <button type="button" class="ghost-btn" id="btn-debug-clear">清空</button>
        <button type="button" class="ghost-btn" id="btn-debug-close">收起</button>
      </span>
    </div>
    <div class="debug-body" id="debug-body"></div>
  </div>

  <!-- P3-D：agent 的提问。手机与桌面都能看到，谁先答谁生效。 -->
  <div class="qcard" id="qcard" hidden>
    <div class="qcard-head">
      <span class="qcard-title" id="qcard-title">需要你决定</span>
      <span class="qcard-count" id="qcard-count"></span>
      <!-- 提问卡片会一直占着输入框上方那块地，把上面的会话消息挤扁。
           收起后只留这一行（标题 + 还剩几题），要点开随时点得回来。 -->
      <button type="button" class="ghost-btn qcard-toggle" id="qcard-toggle" aria-expanded="true" aria-controls="qcard-body">收起</button>
    </div>
    <div class="qcard-body" id="qcard-body"></div>
    <div class="qcard-foot">
      <button type="button" class="btn" id="qcard-submit">提交</button>
      <span class="qcard-note" id="qcard-note"></span>
    </div>
  </div>

  <!-- 底部区域：状态/芯片条 + 输入区。合成一块，只画一条上边框。 -->
  <div class="chat-foot">
    <!-- 状态与模式/模型芯片。原来在顶栏，挪到输入框上方 —— 手机单手操作时顶栏是
         拇指最难够的区域，输入框上方才是舒适区（DeepSeek 网页端也在这一带）。 -->
    <div class="chat-sub" id="chat-sub"></div>

    <div class="composer" id="composer" hidden>
      <div class="composer-row">
        <textarea id="composer-input" rows="1" placeholder="发消息…" autocomplete="off" spellcheck="false"></textarea>
        <button type="button" class="btn btn-send" id="composer-send" disabled aria-label="发送" title="发送">↑</button>
      </div>
      <div class="composer-foot">
        <span class="composer-note">Enter 换行 · 桌面端 Ctrl/⌘ + Enter 发送</span>
        <span class="composer-count" id="composer-count" hidden></span>
      </div>
    </div>
  </div>
</section>

<!-- ==================== 底部选择面板（模型 / 模式） ==================== -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head">
      <div class="sheet-title" id="sheet-title"></div>
      <button type="button" class="ghost-btn" id="sheet-close">关闭</button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<noscript><div class="toast">这个页面需要开启 JavaScript。</div></noscript>
</body>
</html>
